name: Live Demo

on:
  workflow_dispatch:
    inputs:
      hue:
        description: Allowlisted palco hue
        required: false
        type: choice
        options: [cyan, amber, violet, rose]
        default: cyan
      shape:
        description: Allowlisted palco shape
        required: false
        type: choice
        options: [cube, ring, bar]
        default: cube

permissions:
  contents: read

concurrency:
  group: live-demo
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  security:
    name: Security
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit (high+, production)
        # Prod deps only — wrangler/miniflare (dev) pull undici/ws advisories that are not shipped to the Worker.
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Test
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

  ai-review:
    name: AI Review
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: AI review gate (demo)
        run: |
          echo "Live demo — AI review runs on failure via Edge Labs from the UI."
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "TOTE e2e (Playwright) and host security gates live in dangalasse/TOTE — not in this Worker demo."

  preview:
    name: Preview
    needs: ai-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Pin lab knobs
        id: knobs
        env:
          HUE: ${{ inputs.hue }}
          SHAPE: ${{ inputs.shape }}
        run: |
          set -euo pipefail
          hue="${HUE:-cyan}"
          shape="${SHAPE:-cube}"
          case "$hue" in cyan|amber|violet|rose) ;; *) echo "rejected hue" >&2; exit 1 ;; esac
          case "$shape" in cube|ring|bar) ;; *) echo "rejected shape" >&2; exit 1 ;; esac
          echo "hue=$hue" >> "$GITHUB_OUTPUT"
          echo "shape=$shape" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_DEPLOY_ENV: preview
          VITE_BUILD_TIME: ${{ github.run_started_at }}
          VITE_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VITE_LAB_HUE: ${{ steps.knobs.outputs.hue }}
          VITE_LAB_SHAPE: ${{ steps.knobs.outputs.shape }}
        run: npm run build

      - name: Deploy sandbox Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy --env preview
            --var GIT_SHA:${{ github.sha }}
            --var BUILD_TIME:${{ github.run_started_at }}
            --var GITHUB_RUN_URL:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --var DEPLOY_ENV:preview
            --var LAB_HUE:${{ steps.knobs.outputs.hue }}
            --var LAB_SHAPE:${{ steps.knobs.outputs.shape }}

      - name: Smoke palco
        env:
          HUE: ${{ steps.knobs.outputs.hue }}
          SHAPE: ${{ steps.knobs.outputs.shape }}
        run: |
          set -euo pipefail
          URL='https://pipeline-pulse-preview.dantonguerragalasse.workers.dev'
          ok=0
          for i in 1 2 3 4 5 6 8; do
            if curl -fsS "$URL/api/lab-object" > /tmp/lab.json; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "lab-object never became ready" >&2
            exit 1
          fi
          cat /tmp/lab.json
          python3 - <<'PY'
          import json, os, sys
          with open('/tmp/lab.json', encoding='utf-8') as f:
              data = json.load(f)
          if data.get('hue') != os.environ['HUE']:
              sys.exit(f"hue mismatch: {data!r}")
          if data.get('shape') != os.environ['SHAPE']:
              sys.exit(f"shape mismatch: {data!r}")
          PY
          curl -fsS -o /dev/null -w '%{http_code}\n' "$URL/lab" | grep -Eq '200'
