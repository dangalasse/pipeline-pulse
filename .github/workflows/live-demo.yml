name: Live Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-demo
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  security:
    name: Security
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit (high+, production)
        # Prod deps only — wrangler/miniflare (dev) pull undici/ws advisories that are not shipped to the Worker.
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Test
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

  ai-review:
    name: AI Review
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: AI review gate (demo)
        run: |
          echo "Live demo — AI review runs on failure via Edge Labs from the UI."
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "TOTE e2e (Playwright) and host security gates live in dangalasse/TOTE — not in this Worker demo."

  build:
    name: Build
    needs: ai-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_DEPLOY_ENV: live-demo
          VITE_BUILD_TIME: ${{ github.run_started_at }}
          VITE_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run build
