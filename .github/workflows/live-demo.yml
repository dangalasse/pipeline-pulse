name: Live Demo

on:
  workflow_dispatch:
    inputs:
      sourceSha:
        description: SHA of the snippet stored in KV lab:pending (audit only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: live-demo
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  security:
    name: Security
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit (high+, production)
        # Prod deps only — wrangler/miniflare (dev) pull undici/ws advisories that are not shipped to the Worker.
        run: npm audit --omit=dev --audit-level=high

      - name: Security contracts (Vitest)
        run: npm run test:security

  test:
    name: Test
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

  ai-review:
    name: AI Review
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Contract probe (no Edge Labs payload)
        run: |
          set -euo pipefail
          URL='https://pipeview.galasse.dev'
          curl -fsS "$URL/api/health" > /tmp/health.json
          python3 - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as handle:
              data = json.load(handle)
          if data.get('ok') is not True:
              raise SystemExit(f'health not ok: {data!r}')
          if any(str(k).lower() in ('token', 'secret', 'password') for k in data):
              raise SystemExit(f'health leaked credential key: {data!r}')
          PY
          code=$(curl -sS -o /tmp/ai.json -w '%{http_code}' \
            -X POST "$URL/api/demo-ai-review" \
            -H 'content-type: application/json' \
            -d '{"message":"probe"}')
          echo "$code" | grep -Eq '403|503'
          python3 - <<'PY'
          import json
          with open('/tmp/ai.json', encoding='utf-8') as handle:
              data = json.load(handle)
          if any(str(k).lower() in ('token', 'secret', 'password', 'authorization') for k in data):
              raise SystemExit(f'review probe leaked credential key: {data!r}')
          PY

  preview:
    name: Preview
    needs: ai-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Promote pending snippet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_SHA: ${{ inputs.sourceSha }}
        run: |
          set -euo pipefail
          NS='7c26464ce85340e981359bfc0a22deba'
          npx wrangler kv key get lab:pending --namespace-id="$NS" --remote --text > /tmp/lab-pending.html
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          raw = Path('/tmp/lab-pending.html').read_bytes()
          if not raw.strip():
              raise SystemExit('lab:pending is empty')
          if len(raw) > 8192:
              raise SystemExit('lab:pending exceeds 8 KiB')
          sha = hashlib.sha256(raw).hexdigest()[:16]
          expect = os.environ.get('EXPECT_SHA', '').strip()
          if expect and expect != sha:
              raise SystemExit(f'sourceSha mismatch: {sha} != {expect}')
          print(f'pending_ok bytes={len(raw)} sha={sha}')
          PY
          npx wrangler kv key put lab:source --namespace-id="$NS" --remote --path /tmp/lab-pending.html

      - name: Build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_DEPLOY_ENV: preview
          VITE_BUILD_TIME: ${{ github.run_started_at }}
          VITE_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run build

      - name: Deploy sandbox Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy --env preview
            --var GIT_SHA:${{ github.sha }}
            --var BUILD_TIME:${{ github.run_started_at }}
            --var GITHUB_RUN_URL:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --var DEPLOY_ENV:preview

      - name: Smoke palco
        run: |
          set -euo pipefail
          URL='https://pipeline-pulse-preview.dantonguerragalasse.workers.dev'
          ok=0
          for i in 1 2 3 4 5 6 8; do
            if curl -fsS "$URL/api/lab-object" > /tmp/lab.json; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "lab-object never became ready" >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path('/tmp/lab.json').read_text(encoding='utf-8'))
          source = data.get('source')
          if not isinstance(source, str) or not source.strip():
              sys.exit('lab-object missing source')
          if 'hue' in data or 'shape' in data:
              sys.exit(f'legacy knobs leaked: {list(data)}')
          if data.get('env') != 'preview':
              sys.exit(f'expected preview env, got {data.get("env")!r}')
          sha = hashlib.sha256(source.encode()).hexdigest()[:16]
          if data.get('sourceSha') != sha:
              sys.exit(f'sourceSha mismatch: {data.get("sourceSha")} != {sha}')
          pending = Path('/tmp/lab-pending.html')
          if pending.exists():
              want = hashlib.sha256(pending.read_bytes()).hexdigest()[:16]
              if sha != want:
                  sys.exit(f'shipped sha {sha} != pending {want}')
          print('lab-object ok', sha, 'bytes', len(source.encode()))
          PY
          curl -fsS -o /dev/null -w '%{http_code}\n' "$URL/lab" | grep -Eq '200'

      - name: E2E palco (Playwright)
        env:
          E2E_BASE_URL: https://pipeline-pulse-preview.dantonguerragalasse.workers.dev
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  staging:
    name: Staging
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sandbox smoke (preview only)
        run: bash scripts/sandbox-smoke.sh staging

  production:
    name: Production
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sandbox smoke (preview only)
        run: bash scripts/sandbox-smoke.sh production
      - name: Assert conveyor jobs in this run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/assert-live-demo-jobs.py
