name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Staging
    if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_DEPLOY_ENV: staging
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          VITE_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run build

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy --env staging
            --var GIT_SHA:${{ github.sha }}
            --var BUILD_TIME:${{ github.event.head_commit.timestamp || github.run_started_at }}
            --var GITHUB_RUN_URL:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --var DEPLOY_ENV:staging

      - name: Smoke /api/health
        run: |
          set -euo pipefail
          URL="${{ vars.STAGING_URL }}"
          if [ -z "$URL" ]; then
            URL="https://staging.pipeline.galasse.dev"
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/api/health" | grep -q '"ok":true'; then
              echo "smoke ok against $URL"
              exit 0
            fi
            sleep 3
          done
          echo "smoke failed against $URL" >&2
          exit 1

  deploy-production:
    name: Production
    if: startsWith(github.ref, 'refs/tags/v') && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_DEPLOY_ENV: production
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          VITE_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run build

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy
            --var GIT_SHA:${{ github.sha }}
            --var BUILD_TIME:${{ github.event.head_commit.timestamp || github.run_started_at }}
            --var GITHUB_RUN_URL:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --var DEPLOY_ENV:production

      - name: Smoke /api/health
        run: |
          set -euo pipefail
          URL="${{ vars.PRODUCTION_URL }}"
          if [ -z "$URL" ]; then
            URL="https://pipeline.galasse.dev"
          fi
          for i in 1 2 3 4 5 6 8; do
            if curl -fsS "$URL/api/health" | grep -q '"ok":true'; then
              echo "smoke ok against $URL"
              exit 0
            fi
            sleep 4
          done
          echo "smoke failed against $URL" >&2
          exit 1

  # Keeps the Deploy workflow green while documenting the one remaining secret.
  # Live edge is already provisioned (pipeline.galasse.dev / staging.pipeline.galasse.dev).
  gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    steps:
      - name: Report deploy readiness
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "CI artifact path is ready; edge URLs:"
          echo "  production → https://pipeline.galasse.dev"
          echo "  staging    → https://staging.pipeline.galasse.dev"
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "CLOUDFLARE_API_TOKEN is set — wrangler deploy jobs will run."
          else
            echo "CLOUDFLARE_API_TOKEN not set yet."
            echo "Create a token (Edit Cloudflare Workers template) and run:"
            echo "  gh secret set CLOUDFLARE_API_TOKEN -R dangalasse/pipeline-pulse"
            echo "  gh secret set CLOUDFLARE_ACCOUNT_ID -R dangalasse/pipeline-pulse -b 4483b58d6fc9d89f06c521fd83a9a963"
          fi
          curl -fsS https://pipeline.galasse.dev/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
