name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check token + live edge
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "production → https://pipeline.galasse.dev"
          echo "staging    → https://staging.pipeline.galasse.dev"
          curl -fsS https://pipeline.galasse.dev/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          if [ -n "${TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is set — wrangler jobs will run."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN missing — staging/prod deploy cannot run."
            echo "Create an API token (Workers Edit) then:"
            echo "  gh secret set CLOUDFLARE_API_TOKEN -R dangalasse/pipeline-pulse"
            exit 1
          fi

  deploy-staging:
    name: Staging
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_DEPLOY_ENV: staging
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          VITE_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run build

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy --env staging
            --var GIT_SHA:${{ github.sha }}
            --var BUILD_TIME:${{ github.event.head_commit.timestamp || github.run_started_at }}
            --var GITHUB_RUN_URL:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --var DEPLOY_ENV:staging

      - name: Smoke /api/health
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL}" ]; then
            URL="https://staging.pipeline.galasse.dev"
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/api/health" | grep -q '"ok":true'; then
              echo "smoke ok against $URL"
              exit 0
            fi
            sleep 3
          done
          echo "smoke failed against $URL" >&2
          exit 1

  deploy-production:
    name: Production
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_DEPLOY_ENV: production
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          VITE_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run build

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy
            --var GIT_SHA:${{ github.sha }}
            --var BUILD_TIME:${{ github.event.head_commit.timestamp || github.run_started_at }}
            --var GITHUB_RUN_URL:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --var DEPLOY_ENV:production

      - name: Smoke /api/health
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL}" ]; then
            URL="https://pipeline.galasse.dev"
          fi
          for i in 1 2 3 4 5 6 8; do
            if curl -fsS "$URL/api/health" | grep -q '"ok":true'; then
              echo "smoke ok against $URL"
              exit 0
            fi
            sleep 4
          done
          echo "smoke failed against $URL" >&2
          exit 1
