name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-gate:
    name: Preview gate
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check token
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "Preview deploy skipped until CLOUDFLARE_API_TOKEN is set."
            echo "CI still runs on every PR."
          fi

  preview:
    name: Deploy Cloudflare preview
    needs: preview-gate
    if: needs.preview-gate.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_DEPLOY_ENV: preview
          VITE_BUILD_TIME: ${{ github.event.pull_request.updated_at }}
          VITE_GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VITE_LAB_HUE: cyan
          VITE_LAB_SHAPE: cube
        run: npm run build

      - name: Deploy Workers preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            deploy --env preview
            --var GIT_SHA:${{ github.sha }}
            --var BUILD_TIME:${{ github.event.pull_request.updated_at }}
            --var GITHUB_RUN_URL:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --var DEPLOY_ENV:preview
            --var LAB_HUE:cyan
            --var LAB_SHAPE:cube

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url =
              'https://pipeline-pulse-preview.dantonguerragalasse.workers.dev';
            const body = [
              '### Pipeview preview',
              '',
              `Deployed from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`.`,
              '',
              `**Preview:** ${url}`,
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes('Pipeview preview'),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
